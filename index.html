<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de QR</title>
<script src="qrcode.js"></script>
<style>
  :root { --fondo:#f3f0ff; --tarjeta:#fff; --texto:#2b2350; --suave:#6b6390; --violeta:#6c4cf5; --borde:#ddd6ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:linear-gradient(160deg,#ede7ff,#e0f4ff); color:var(--texto);
         display:flex; justify-content:center; align-items:flex-start; padding:24px 16px; }
  .tarjeta { background:var(--tarjeta); width:100%; max-width:440px; border-radius:24px; padding:28px 22px;
             box-shadow:0 12px 40px rgba(80,60,180,.15); text-align:center; }
  h1 { margin:0 0 4px; font-size:1.7rem; }
  .sub { margin:0 0 22px; color:var(--suave); }
  label { display:block; text-align:left; font-weight:600; margin:14px 0 6px; }
  input { width:100%; font-size:1.1rem; padding:14px; border:2px solid var(--borde); border-radius:14px; outline:none; }
  input:focus { border-color:var(--violeta); }
  .hacer { margin-top:20px; width:100%; font-size:1.25rem; font-weight:700; padding:16px; border:0; border-radius:16px;
           background:var(--violeta); color:#fff; cursor:pointer; }
  .hacer:active { transform:scale(.98); }
  #error { color:#d33; min-height:1.2em; margin:10px 0 0; }
  #resultado { display:none; margin-top:18px; }
  canvas { width:100%; max-width:300px; border-radius:16px; border:2px solid var(--borde); }
  .botones { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .botones button { font-size:1rem; font-weight:600; padding:14px 8px; border:0; border-radius:14px; cursor:pointer; color:#fff; }
  .modos { display:flex; gap:8px; margin-top:16px; }
  .modos button { flex:1; font-size:1rem; padding:12px 6px; border:2px solid var(--borde); border-radius:14px; background:#fff; color:var(--texto); cursor:pointer; }
  .modos .activo { border-color:var(--violeta); background:#efeaff; font-weight:700; }
  .otro { margin:10px auto 0; display:block; font-size:1rem; font-weight:600; padding:10px 18px; border:2px solid var(--violeta); border-radius:14px; background:#fff; color:var(--violeta); cursor:pointer; }
  .wa { background:#25d366; } .gm { background:#ea4335; } .im { background:#3b82f6; } .de { background:#f59e0b; }
</style>
</head>
<body>
<main class="tarjeta">
  <h1>Generador de QR</h1>
  <p class="sub">Título, link y listo</p>

  <label for="titulo">1. Título</label>
  <input id="titulo" placeholder="Fracciones 4°">

  <label for="link">2. Pegá el link</label>
  <input id="link" placeholder="https://drive.google.com/..." inputmode="url">

  <div class="modos">
    <button id="mDib" class="activo" onclick="elegirModo('dibujos')">🎨 Con dibujos</button>
    <button id="mByN" onclick="elegirModo('byn')">⬛ Blanco y negro</button>
  </div>

  <button class="hacer" onclick="hacerQR()">3. HACER QR</button>
  <p id="error"></p>

  <section id="resultado">
    <canvas id="lienzo"></canvas>
    <p id="aviso" style="color:#7c2d12;font-weight:bold;text-align:center"></p>
    <button id="otro" class="otro" onclick="otroDiseno()">🔄 Otro diseño</button>
    <div class="botones">
      <button class="wa" onclick="whatsapp()">WhatsApp</button>
      <button class="gm" onclick="gmail()">Gmail</button>
      <button class="im" onclick="imprimir()">Imprimir</button>
      <button class="de" onclick="descargar()">Descargar</button>
    </div>
  </section>
</main>

<script>
let titulo = "", link = "";

function hacerQR() {
  titulo = document.getElementById("titulo").value.trim();
  link = document.getElementById("link").value.trim();
  const error = document.getElementById("error");
  error.textContent = "";
  if (!link) { error.textContent = "Falta pegar el link."; return; }
  if (!/^https?:\/\//i.test(link)) link = "https://" + link;

  // Páginas del Drive propio (Recientes, Mi unidad...) no sirven: cada uno ve su propio Drive
  if (/drive\.google\.com\/drive\/(u\/\d+\/)?(recent|my-drive|home|shared-with-me|starred|trash|search|computers)/i.test(link)) {
    error.textContent = "Ese link es de tu Drive, no se puede compartir. En el archivo tocá ⋮ → Compartir → «Cualquier persona con el enlace» → Copiar vínculo, y pegalo acá.";
    return;
  }

  // Links de descarga directa -> link para ver (cada uno descarga si quiere)
  const id = link.match(/drive(?:\.usercontent)?\.google\.com\/(?:uc|download)\?.*\bid=([\w-]+)/i);
  if (id) link = "https://drive.google.com/file/d/" + id[1] + "/view";
  const abrir = link.match(/drive\.google\.com\/open\?(?:.*&)?id=([\w-]+)/i);
  if (abrir) link = "https://drive.google.com/file/d/" + abrir[1] + "/view";
  // Cualquier archivo de Drive (imagen, PDF, Word, LibreOffice...): vista previa en el navegador, sin app
  const arch = link.match(/drive\.google\.com\/(?:u\/\d+\/)?file\/d\/([\w-]+)/i);
  if (arch) link = "https://drive.google.com/file/d/" + arch[1] + "/preview";
  // Documentos, planillas y presentaciones de Google: vista previa, se abre en cualquier navegador sin app ni cuenta
  const doc = link.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/(?:u\/\d+\/)?d\/([\w-]+)/i);
  if (doc) link = "https://docs.google.com/" + doc[1] + "/d/" + doc[2] + "/preview";
  link = link.replace(/(dropbox\.com\/.*[?&])dl=1/i, "$1dl=0");
  if (!id && /\.(pdf|zip|rar|mp3|mp4|docx?|pptx?|xlsx?)(\?|#|$)/i.test(link) && !/google\.com|youtube|youtu\.be|padlet/i.test(link)) {
    error.textContent = "Ojo: este link descarga el archivo directo. Mejor subilo a Drive y pegá el link de «Compartir».";
    return;
  }

  document.getElementById("aviso").textContent = /google\.com|youtu/i.test(link)
    ? "Para que lo abra cualquiera: el archivo tiene que estar en «Cualquier persona con el enlace» (Drive) o «No listado/Público» (YouTube)." : "";
  tema = buscarTema(titulo);
  dibujar();
  document.getElementById("resultado").style.display = "block";
  document.getElementById("lienzo").scrollIntoView({ behavior: "smooth" });
}

// Temas: si alguna palabra está en el título, se usan esos dibujos
const TEMAS = [
  [["gat", "felin", "michi"], "🐱🐈😺🐾🧶"],
  [["perr", "cachorr"], "🐶🐕🦴🐾🐩"],
  [["dino"], "🦕🦖🌋🥚🦴"],
  [["pajar", "aves", "loro", "buho", "paloma"], "🐦🦜🦉🐤🪶"],
  [["oceano", "peces", "pez", "playa", "ballena", "acuatic", "delfin"], "🐠🐳🐙🦀🌊🐚"],
  [["insect", "mariposa", "abeja", "hormiga", "bicho", "arana"], "🦋🐝🐞🐛🐜"],
  [["animal", "zoo", "fauna", "selva", "leon", "elefante", "granja"], "🦁🐘🦒🐒🐯🦓🐮"],
  [["avion", "vuelo", "aeropuerto"], "✈️🛫☁️🚁🪂"],
  [["auto", "coche", "transport", "camion", "tren", "colectivo", "vehicul", "barco"], "🚗🚙🚌🏎️🚕🚂🚢"],
  [["espacio", "planeta", "sistema solar", "astro", "luna", "estrella", "univers", "cohete"], "🚀🪐🌍☀️🌙⭐"],
  [["primavera"], "🌸🌷🐝🌼🦋"],
  [["verano", "vacacion"], "☀️🏖️🍉🕶️🌴"],
  [["otono"], "🍂🍁🍄🌰🍃"],
  [["invierno", "nieve", "frio"], "❄️⛄🧣☃️🧤"],
  [["clima", "lluvia", "nube", "ciclo del agua", "meteor"], "☁️🌧️🌈⛅💧"],
  [["natur", "planta", "flor", "arbol", "bosque", "jardin", "hoja", "semilla", "huerta"], "🌻🌳🌷🍀🌱🍃"],
  [["fraccion", "mitad", "pizza"], "🍕🥧🍰🧀🍫"],
  [["mate", "numer", "suma", "resta", "multiplic", "divis", "geometr", "calcul", "tabla"], "🔢➕➖✖️➗📐📏"],
  [["cienc", "experiment", "quimic", "fisic", "laborator", "biolog", "celula"], "🔬🧪⚗️🧫🧬🧲"],
  [["cuerpo", "salud", "higien", "diente", "corazon", "esqueleto", "hueso"], "🫀🦷🦴🧠💪🩺"],
  [["histor", "patri", "revolucion", "independencia", "bandera", "mayo", "julio", "san martin", "belgrano", "sarmiento"], "🏛️📜🎖️🥁☀️🕊️"],
  [["geograf", "mapa", "pais", "continent", "mundo", "provincia", "ciudad"], "🌎🗺️🧭🏔️🏙️"],
  [["lengua", "lectura", "leer", "escrit", "cuento", "poesia", "poema", "letra", "literat", "ortograf", "gramatic", "biblioteca", "libro"], "📚📖✏️📝🖋️🔤"],
  [["arte", "dibuj", "pint", "color", "plastic"], "🎨🖌️🖍️🖼️✂️"],
  [["music", "cancion", "canto", "instrument", "ritmo"], "🎵🎸🥁🎹🎺🎶"],
  [["deport", "futbol", "educacion fisica", "gimnasia", "pelota", "juego"], "⚽🏀🏐🎾🏃🏅"],
  [["comida", "aliment", "fruta", "verdura", "cocina", "receta", "nutric"], "🍎🍌🥕🍇🥦🍓"],
  [["fiesta", "cumple", "celebr", "acto", "festej"], "🎉🎈🎂🎁🥳🎊"],
  [["tecno", "compu", "robot", "program", "digital", "internet"], "💻🤖🖥️🔌⚙️🕹️"],
  [["escuela", "clase", "aula", "tarea", "examen", "evaluac", "alumn"], "✏️📚🎒📏🍎🖍️"]
];
const FONDOS = ["#ffe8f0", "#e6f4ff", "#eafbe7", "#fff4d6", "#f0e8ff", "#e0faf6", "#ffeede"];
const TINTAS = ["#2b2350", "#1e3a8a", "#14532d", "#7c2d12", "#581c87", "#0f4c5c", "#831843"];
let tema, modo = "dibujos";
const azar = a => a[Math.floor(Math.random() * a.length)];
const emojis = s => Array.from(s.matchAll(/\p{Extended_Pictographic}️?/gu), m => m[0]);

function buscarTema(t) {
  t = t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const hallado = TEMAS.find(([palabras]) => palabras.some(p => t.includes(p)));
  return emojis((hallado || azar(TEMAS))[1]);
}

function elegirModo(m) {
  modo = m;
  document.getElementById("mDib").classList.toggle("activo", m === "dibujos");
  document.getElementById("mByN").classList.toggle("activo", m === "byn");
  document.getElementById("otro").style.display = m === "dibujos" ? "block" : "none";
  if (link && document.getElementById("resultado").style.display === "block") dibujar();
}

function dibujar() {
  if (modo === "dibujos") return dibujarConDibujos();
  const qr = qrcode(0, "M");
  qr.addData(link);
  qr.make();

  // Dibuja el QR grande con el título abajo, listo para imprimir
  const n = qr.getModuleCount(), celda = Math.floor(600 / (n + 8)), margen = celda * 4;
  const lado = n * celda + margen * 2, alto = titulo ? lado + 90 : lado;
  const c = document.getElementById("lienzo"), g = c.getContext("2d");
  c.width = lado; c.height = alto;
  g.fillStyle = "#fff"; g.fillRect(0, 0, lado, alto);
  g.fillStyle = "#000";
  for (let f = 0; f < n; f++)
    for (let k = 0; k < n; k++)
      if (qr.isDark(f, k)) g.fillRect(margen + k * celda, margen + f * celda, celda, celda);
  if (titulo) {
    g.fillStyle = "#2b2350";
    g.font = "bold 40px system-ui, sans-serif";
    g.textAlign = "center";
    g.fillText(titulo, lado / 2, lado + 45, lado - 40);
  }
}

function dibujarConDibujos() {
  // Corrección alta: el QR se lee aunque el dibujo del centro tape un pedacito
  const qr = qrcode(0, "H");
  qr.addData(link);
  qr.make();
  const n = qr.getModuleCount(), celda = Math.floor(520 / (n + 4)), quieto = celda * 2;
  const qrLado = n * celda + quieto * 2, F = 80, W = qrLado + F * 2, H = qrLado + F * 2 + (titulo ? 80 : 0);
  const tinta = azar(TINTAS), fuenteEmoji = "'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif";
  const c = document.getElementById("lienzo"), g = c.getContext("2d");
  c.width = W; c.height = H;
  g.fillStyle = azar(FONDOS); g.fillRect(0, 0, W, H);

  // Marco de dibujitos alrededor
  g.textAlign = "center"; g.textBaseline = "middle"; g.font = "42px " + fuenteEmoji;
  const poner = (x, y) => { g.save(); g.translate(x, y); g.rotate((Math.random() - .5) * .6); g.fillText(azar(tema), 0, 0); g.restore(); };
  for (let x = F / 2; x < W; x += 66) { poner(x, F / 2); poner(x, H - F / 2); }
  for (let y = F / 2 + 66; y < H - F / 2 - 30; y += 66) { poner(F / 2, y); poner(W - F / 2, y); }

  // QR sobre blanco, con puntitos redondeados de color
  g.fillStyle = "#fff"; g.beginPath(); g.roundRect(F, F, qrLado, qrLado, 24); g.fill();
  g.fillStyle = tinta;
  const esOjo = (f, k) => (f < 7 && (k < 7 || k >= n - 7)) || (f >= n - 7 && k < 7);
  for (let f = 0; f < n; f++)
    for (let k = 0; k < n; k++)
      if (qr.isDark(f, k)) {
        const x = F + quieto + k * celda, y = F + quieto + f * celda;
        if (esOjo(f, k)) g.fillRect(x, y, celda, celda);
        else { g.beginPath(); g.roundRect(x + .5, y + .5, celda - 1, celda - 1, celda * .35); g.fill(); }
      }

  // Dibujo del centro
  const cx = F + qrLado / 2, cy = F + qrLado / 2, r = qrLado * .11;
  g.fillStyle = "#fff"; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  g.font = Math.round(r * 1.3) + "px " + fuenteEmoji; g.fillText(tema[0], cx, cy + 2);

  if (titulo) {
    g.fillStyle = tinta; g.font = "bold 40px system-ui, sans-serif";
    g.fillText(titulo, W / 2, F + qrLado + 45, W - 2 * F);
  }
}

function otroDiseno() {
  tema = tema.slice(1).concat(tema[0]);
  dibujar();
}

function nombreArchivo() { return (titulo || "qr").replace(/[^\wáéíóúñ ]/gi, "").trim() + ".png"; }

function imagen() {
  return new Promise(r => document.getElementById("lienzo").toBlob(b => r(new File([b], nombreArchivo(), { type: "image/png" }))));
}

async function whatsapp() {
  const archivo = await imagen();
  // En el celular comparte la imagen del QR; en la compu manda el link
  const celular = /Android|iPhone|iPad/i.test(navigator.userAgent);
  if (celular && navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try { await navigator.share({ files: [archivo], title: titulo, text: titulo }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  // En la compu copia la imagen del QR para pegarla en el chat con Ctrl+V
  try {
    await navigator.clipboard.write([new ClipboardItem({ "image/png": archivo })]);
    document.getElementById("error").textContent = "QR copiado: en el chat de WhatsApp apretá Ctrl+V para pegarlo.";
  } catch (e) {}
  window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent((titulo ? titulo + ": " : "") + link), "_blank");
}

function gmail() {
  descargar();
  window.open("https://mail.google.com/mail/?view=cm&su=" + encodeURIComponent(titulo || "QR") +
              "&body=" + encodeURIComponent(link + "\n\n(Adjuntá el QR que se acaba de descargar)"), "_blank");
}

function descargar() {
  const a = document.createElement("a");
  a.href = document.getElementById("lienzo").toDataURL("image/png");
  a.download = nombreArchivo();
  a.click();
}

function imprimir() {
  const v = window.open("", "_blank");
  v.document.write('<html><body style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh">' +
    '<img src="' + document.getElementById("lienzo").toDataURL() + '" style="width:70%" onload="print()"></body></html>');
  v.document.close();
}
</script>
</body>
</html>
